<!DOCTYPE html>
<html lang="pt-BR>
<head>
    <meta charset=" UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cliente Web Externo</title>
</head>

<body>

    <h1>CRUD - Cliente HTML/JavaScript</h1>

    <div>
        <label for="id">ID:</label>
        <input type="text" id="id">
    </div>

    <div>
        <label for="nome">Nome:</label>
        <input type="text" id="nome">
    </div>

    <div>
        <label for="preco">Preço:</label>
        <input type="text" id="preco">
    </div>

    <div>
        <label for="quantidade">Quantidade:</label>
        <input type="text" id="quantidade">
    </div>

    <div>
        <label for="status">Status</label>
        <input type="text" id="status">
    </div>

    <button onclick="salvar()" style="background-color: green; color: #fff;">Salvar</button>

    <button onclick="atualizar()" style="background-color: blue; color: #fff;">Atualizar</button>

    <button onclick="deletar()" style="background-color: red; color: #fff;">deletar</button>

    <button onclick="carregarCampos()" style="background-color: gray; color: #fff;">Consultar</button>

    <button onclick="limparCampos()" style="background-color: black; color: #fff;">Limpar</button>

    <h2>Lista de Produtos</h2>
    <ul id="lista-produtos"></ul>
    <p id="total-produtos"></p> <!--Será ser adicionado Sozinho-->

    <script>
        const BASE_URL = 'http://localhost:8080/produtos';

        // Coletar dados do formulário
        function getProdutoForm() {
            const nome = document.getElementById('nome').value;
            const preco = document.getElementById('preco').value;
            const quantidade = document.getElementById('quantidade').value;
            const status = document.getElementById('status').value;

            return {
                nome,
                preco: parseFloat(preco),
                quantidade: parseInt(quantidade),
                status
            };
        }

        // Listar todos os produtos
        async function listarTodos() {
            const response = await fetch(BASE_URL);
            const produtos = await response.json();

            const lista = document.getElementById('lista-produtos');
            const total = document.getElementById('total-produtos');

            lista.innerHTML = '';

            produtos.forEach(produto => {
                const item = document.createElement('li');

                item.textContent = `ID: ${produto.id}, Nome: ${produto.nome}, Preço: ${produto.preco}, Quantidade: ${produto.quantidade}, Status: ${produto.status}`;

                lista.append(item);
            });

            total.textContent = `Total de Produtos: ${produtos.length}`;
        }

        // Salvar produto
        async function salvar() {
            const produto = getProdutoForm();

            await fetch(BASE_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(produto)
            });

            listarTodos();
        }

        // Atualizar produto
        async function atualizar() {
            const produto = getProdutoForm();
            const id = document.getElementById('id').value;

            await fetch(`${BASE_URL}/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(produto)
            });

            listarTodos();
        }

        // Deletar produto
        async function deletar() {
            const id = document.getElementById('id').value;

            await fetch(`${BASE_URL}/${id}`, {
                method: 'DELETE'
            });

            listarTodos();
        }

        // Consultar produto pelo ID
        function carregarCampos() {
            const id = document.getElementById('id').value;

            fetch(`${BASE_URL}/${id}`)
                .then(response => response.json())
                .then(produto => {
                    document.getElementById('nome').value = produto.nome;
                    document.getElementById('preco').value = produto.preco;
                    document.getElementById('quantidade').value = produto.quantidade;
                    document.getElementById('status').value = produto.status;
                })
                .catch(error => {
                    console.error('Erro ao consultar produto:', error);
                });
        }

        // Limpar formulário
        function limparCampos() {
            document.getElementById('id').value = '';
            document.getElementById('nome').value = '';
            document.getElementById('preco').value = '';
            document.getElementById('quantidade').value = '';
            document.getElementById('status').value = '';
        }

        // Carregar produtos ao abrir a página
        document.addEventListener('DOMContentLoaded', listarTodos);
    </script>
</body>
</html>
