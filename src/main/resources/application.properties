spring.application.name=projeto-spring

# URL de conexão com o banco MySQL (substitua 'nome_do_seu_banco' pelo nome real do banco)
spring.datasource.url=jdbc:mysql://localhost:3306/lojaProdutos?useSSL=false&allowPublicKeyRetrieval=true

# Credenciais de acesso ao MySQL
spring.datasource.username=root
spring.datasource.password=******

# Driver do MySQL (opcional no Spring Boot moderno, mas recomendado)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configurações do JPA / Hibernate (opcional)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
server.error.whitelabel.enabled=false
server.servlet.context-path=/


